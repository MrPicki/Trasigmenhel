<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trasig men Hel</title>

  <!-- Deep links (trasigmenhel.se/lankar) are served this file first, and
       social crawlers don't run the redirect below. Without these tags a
       shared link previews as nothing at all. -->
  <meta name="description" content="Lyssna på Trasig men hel - en podcast om sårbarhet, styrka och människans resa.">
  <link rel="canonical" href="https://trasigmenhel.se/">
  <meta property="og:site_name" content="Trasig men Hel">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trasigmenhel.se/">
  <meta property="og:title" content="Trasig men hel | Podcast">
  <meta property="og:description" content="Lyssna på Trasig men hel - en podcast om sårbarhet, styrka och människans resa.">
  <meta property="og:image" content="https://trasigmenhel.se/lovable-uploads/podcast-cover-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://trasigmenhel.se/lovable-uploads/podcast-cover-og.jpg">
  <meta name="theme-color" content="#0F0F11">
  <link rel="icon" href="/webpic.png" type="image/png">
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current URL and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new URL with only a query string and hash fragment.
    
    // If you're creating a Project Pages site and NOT using a custom domain,
    // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
    // This way the code will only replace the route part of the path, and not
    // the real directory in which the app resides, for example:
    // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
    // https://username.github.io/repo-name/?/one/two&a=b~and~c=d#qwe
    // Otherwise, leave pathSegmentsToKeep as 0.
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
