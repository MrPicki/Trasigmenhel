name: Uppdatera avsnitt

# Sajten läser avsnitten från public/episodes.json. Den här körningen håller
# filen aktuell så att ett nytt avsnitt dyker upp på trasigmenhel.se utan att
# någon behöver göra en commit. En ändring pushas till master, vilket i sin tur
# startar deploy-workflowen.

on:
  schedule:
    # Varannan timme. Avsnitt släpps sällan, men fönstret mellan publicering
    # och att sajten visar det bör vara kort på en släppdag.
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hämta avsnitt
        run: node scripts/fetch-episodes.mjs

      - name: Committa om något ändrats
        run: |
          if git diff --quiet -- public/episodes.json; then
            echo "Inga nya avsnitt — inget att committa."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/episodes.json
          git commit -m "Uppdatera avsnittslistan"
          git push
