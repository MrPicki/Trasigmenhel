name: Deploy till GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      # Hämtar färska avsnitt till public/episodes.json innan bygget, så varje
      # deploy går ut med aktuellt innehåll. Går flödet inte att nå behålls den
      # incheckade filen — därför får steget inte fälla bygget.
      - name: Hämta avsnitt
        continue-on-error: true
        run: node scripts/fetch-episodes.mjs

      - name: Bygg sajten
        run: npm run build

      - name: Ladda upp byggresultat
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Säger till Bing, DuckDuckGo, Yandex och Seznam att adresserna är
      # uppdaterade, i stället för att vänta på att de tittar förbi själva.
      # Sidan är redan ute när det här körs, och ett misslyckat anrop får
      # aldrig fälla en deploy som redan gått igenom.
      - name: Checka ut
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pinga IndexNow
        continue-on-error: true
        run: node scripts/ping-indexnow.mjs
