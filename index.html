<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trasig men Hel | Podcast</title>
    <meta name="description" content="Lyssna på Trasig men Hel, en podcast där vi utforskar resan från trasighet till helhet. Berättelser om personlig utveckling, mentalt välmående och vägen till självacceptans." />
    <meta name="author" content="Trasig men hel" />

    <!-- Social crawlers do not run JavaScript, so these static tags — not the
         Helmet ones — are what actually produce a link preview. They mirror
         the home page's Helmet values exactly so the SPA duplicate is inert. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trasig men Hel" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:url" content="https://trasigmenhel.se/" />

    <meta property="og:image" content="https://trasigmenhel.se/lovable-uploads/podcast-cover-og.jpg" />
    <meta name="theme-color" content="#0B0B0D" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trasigmenhel.se/lovable-uploads/podcast-cover-og.jpg" />

    <!-- Typefaces are self-hosted and bundled by Vite (see src/main.tsx):
         Familjen Grotesk for everything a person reads, Martian Mono for what
         a machine recorded. No third-party stylesheet in the critical path,
         and no visitor IP handed to a font CDN. -->

    <!-- Favicon -->
    <link rel="icon" href="/webpic.png" type="image/png" />
    <link rel="apple-touch-icon" href="/webpic.png" />

    <!-- Script for GitHub Pages SPA routing -->
    <script type="text/javascript">
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

  <body>
    <!--

      no shadows. Familjen Grotesk set huge and tight; Martian Mono only where

      STORY: This is one man's unvarnished account; here is where to follow it.
      FIRST VIEWPORT: Black, undecorated. Wordmark at viewport scale, the

      (ruled) at full width — the primary action, above the fold on a phone.
      Listening here is the quiet third door.
      FORM: candidate 3 of 7 (the case record), seed af97a951; roll ran degraded
      — no challengers were available.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster

    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
